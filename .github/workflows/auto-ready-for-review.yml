name: Auto Ready for Review

on:
  check_suite:
    types: [completed]

permissions:
  pull-requests: write
  contents: read
  checks: read

jobs:
  auto-ready-for-review:
    runs-on: ubuntu-latest
    if: github.event.check_suite.conclusion == 'success'
    steps:
      - name: Get pull requests for this commit
        id: get_prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prs=$(gh pr list --repo ${{ github.repository }} --head ${{ github.event.check_suite.head_branch }} --json number,isDraft --jq '.[] | select(.isDraft == true) | .number')
          if [ -z "$prs" ]; then
            echo "No draft PRs found for this branch"
            echo "pr_number=" >> $GITHUB_OUTPUT
          else
            echo "pr_number=$prs" >> $GITHUB_OUTPUT
          fi

      - name: Mark PR as ready for review
        if: steps.get_prs.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pr_num in ${{ steps.get_prs.outputs.pr_number }}; do
            echo "Marking PR #$pr_num as ready for review"
            gh pr ready $pr_num --repo ${{ github.repository }}
          done

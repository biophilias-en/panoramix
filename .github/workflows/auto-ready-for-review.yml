name: Auto Ready for Review

on:
  check_suite:
    types: [completed]

permissions:
  pull-requests: write
  contents: read
  checks: read

jobs:
  auto-ready-for-review:
    runs-on: ubuntu-latest
    if: github.event.check_suite.conclusion == 'success' && github.event.check_suite.head_branch != ''
    steps:
      - name: Get pull requests for this commit
        id: get_prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get draft PRs for this branch and output as space-separated list
          prs=$(gh pr list --repo ${{ github.repository }} --head "${{ github.event.check_suite.head_branch }}" --json number,isDraft | jq -r '[.[] | select(.isDraft) | .number] | join(" ")')
          if [ -z "$prs" ]; then
            echo "No draft PRs found for this branch"
            echo "pr_numbers=" >> $GITHUB_OUTPUT
          else
            echo "pr_numbers=$prs" >> $GITHUB_OUTPUT
            echo "Found draft PR(s): $prs"
          fi

      - name: Mark PR as ready for review
        if: steps.get_prs.outputs.pr_numbers != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBERS: ${{ steps.get_prs.outputs.pr_numbers }}
        run: |
          # Iterate over PR numbers safely
          for pr_num in $PR_NUMBERS; do
            echo "Marking PR #$pr_num as ready for review"
            gh pr ready "$pr_num" --repo ${{ github.repository }}
          done
